<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SDWG GAME">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>SDWG GAME</title>
  <style>
    :root { --ink: #111; --paper: #fff; }
    html, body {
      margin: 0; height: 100%; min-height: var(--app-h, 100%); overflow: hidden;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#game { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: var(--app-h, 100dvh); display: block; }
    .screen {
      position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100dvh); display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      pointer-events: none;
    }
    .screen.show { display: flex; }
    h1 { font-size: clamp(40px, 12vw, 84px); letter-spacing: 0.04em; margin: 0 0 12px; font-weight: 800; }
    .hint { font-size: 15px; line-height: 1.6; opacity: 0.75; }
    .pulse { margin-top: 28px; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    #over { background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: auto; }
    #over-dist { font-size: clamp(48px, 16vw, 96px); font-weight: 800; }
    #over-info { font: 12px ui-monospace, Menlo, monospace; opacity: 0.6; margin: 8px 0 4px; }
    #best { font-size: 14px; opacity: 0.7; margin-bottom: 28px; }
    button {
      font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em;
      padding: 14px 28px; margin: 6px; border-radius: 999px; cursor: pointer;
      border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
    }
    button.ghost { background: transparent; color: var(--ink); }
    #hud {
      position: fixed; left: 0; right: 0; top: 0; display: none; justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none;
    }
    #hud.show { display: flex; }
    body.night #hud { color: #f2f2f2; }
    body.night #flag { border-color: #f2f2f2; color: #f2f2f2; }
    body.night #debug { color: #f2f2f2; }
    #hud-left, #dist { font-size: 28px; font-weight: 800; }
    #monk { display: none; margin-left: 14px; color: #e5262b; }
    #monk.show { display: inline-block; }
    #monk::before { content: ''; display: inline-block; width: 1.25em; height: 1.25em; background: url(monkey-icon.png) center / contain no-repeat; margin-right: 0.12em; vertical-align: -0.28em; }
    #monk.pop { animation: monkpop 0.3s ease-out; }
    @keyframes monkpop { 40% { transform: scale(1.35); } }
    #seeds { z-index: 5; }
    #flag { pointer-events: auto; margin: 0; padding: 6px 14px; font-size: 20px; opacity: 0.55; }
    #flag.hit { opacity: 1; background: #e5262b; border-color: #e5262b; color: #fff; }
    #rec { margin-top: 10px; opacity: 0.7; }
    button.small { padding: 10px 14px; margin: 0 0 0 6px; font-size: 15px; letter-spacing: 0; }
    button:disabled { opacity: 0.5; }
    #start .menu { margin-top: 22px; pointer-events: auto; }
    #seeds { background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: auto; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 48px); }
    #seeds h2 { font-size: 28px; font-weight: 800; margin: 0 0 18px; }
    #seed-list { width: 100%; max-width: 520px; overflow-y: auto; flex: 0 1 auto; max-height: 65vh; touch-action: pan-y; }
    .seed-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.12); text-align: left; }
    .seed-row button:not(.small) { padding: 10px 18px; margin: 0 0 0 6px; font-size: 14px; }
    .seed-info { flex: 1; min-width: 0; }
    .seed-name { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .seed-meta { font: 12px ui-monospace, Menlo, monospace; opacity: 0.6; margin-top: 2px; }
    .seed-empty { opacity: 0.6; font-size: 15px; padding: 20px 0; }
    #debug {
      position: fixed; left: 16px; top: calc(var(--app-h, 100dvh) - env(safe-area-inset-bottom) - 10px); transform: translateY(-100%);
      font: 11px ui-monospace, Menlo, monospace; opacity: 0.45; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud"><div id="hud-left"><span id="dist">0 м</span><span id="monk"></span></div><button id="flag" class="ghost small" aria-label="Метка: тут что-то не так">⚑</button></div>
  <div id="debug"></div>

  <div id="start" class="screen">
    <h1>SDWG GAME</h1>
    <div class="hint">Свайп влево-вправо — сменить полосу<br>Свайп вверх или тап — прыжок<br>Свайп вниз — подкат (под мостами и трубами)<br>Свайп в красную стену — бег по стене, свайп от неё — прыжок на стену напротив<br>Не врезайся в здания</div>
    <div class="pulse">Тапни, чтобы бежать</div>
    <div class="menu"><button id="open-seeds" class="ghost">Мои города</button><br><button id="shadows" class="ghost small">Тени фонаря: выкл</button></div>
  </div>

  <div id="seeds" class="screen">
    <h2>Мои города</h2>
    <div id="seed-list"></div>
    <div style="margin-top: 18px"><button id="close-seeds" class="ghost">Назад</button></div>
  </div>

  <div id="over" class="screen">
    <div id="over-dist">0 м</div>
    <div id="over-info"></div>
    <div id="best"></div>
    <div>
      <button id="again">Новый город</button>
      <button id="same" class="ghost">Этот же сид</button>
    </div>
    <div><button id="save" class="ghost">Сохранить сид</button><button id="open-seeds-over" class="ghost">Мои города</button></div>
    <div><button id="shadows-over" class="ghost small">Тени фонаря: выкл</button></div>
    <div><button id="rec" class="ghost small">Отправить запись</button></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
