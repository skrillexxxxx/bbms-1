<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SDWG GAME">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>SDWG GAME</title>
  <style>
    :root { --ink: #111; --paper: #fff; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    .screen {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      pointer-events: none;
    }
    .screen.show { display: flex; }
    h1 { font-size: clamp(40px, 12vw, 84px); letter-spacing: 0.04em; margin: 0 0 12px; font-weight: 800; }
    .hint { font-size: 15px; line-height: 1.6; opacity: 0.75; }
    .pulse { margin-top: 28px; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    #over { background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: auto; }
    #over-dist { font-size: clamp(48px, 16vw, 96px); font-weight: 800; }
    #over-info { font: 12px ui-monospace, Menlo, monospace; opacity: 0.6; margin: 8px 0 4px; }
    #best { font-size: 14px; opacity: 0.7; margin-bottom: 28px; }
    button {
      font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em;
      padding: 14px 28px; margin: 6px; border-radius: 999px; cursor: pointer;
      border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
    }
    button.ghost { background: transparent; color: var(--ink); }
    #hud {
      position: fixed; left: 0; right: 0; top: 0; display: none; justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none;
    }
    #hud.show { display: flex; }
    #dist { font-size: 28px; font-weight: 800; }
    #debug {
      position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 10px);
      font: 11px ui-monospace, Menlo, monospace; opacity: 0.45; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud"><div id="dist">0 м</div></div>
  <div id="debug"></div>

  <div id="start" class="screen">
    <h1>SDWG GAME</h1>
    <div class="hint">Веди пальцем влево-вправо — поворот<br>Тап или свайп вверх — прыжок<br>Не врезайся в здания</div>
    <div class="pulse">Тапни, чтобы бежать</div>
  </div>

  <div id="over" class="screen">
    <div id="over-dist">0 м</div>
    <div id="over-info"></div>
    <div id="best"></div>
    <div>
      <button id="again">Новый город</button>
      <button id="same" class="ghost">Этот же сид</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
